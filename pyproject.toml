[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recl2bench"
version = "0.1.0"
description = "L2 reranker benchmark: cross-encoders vs decision models on frozen L1 pools"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "pyyaml>=6",
]

[project.optional-dependencies]
models = ["torch>=2.2", "transformers>=4.51", "sentence-transformers>=3.0", "faiss-cpu>=1.8"]
api = ["httpx>=0.27", "tenacity>=8.2", "certifi"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
