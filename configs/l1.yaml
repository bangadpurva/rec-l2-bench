encoder:
  model: Qwen/Qwen3-Embedding-0.6B
  revision: 97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3   # HF main as of 2026-04-20
user_vector:
  method: recency_weighted_mean_liked
  half_life_days: 180     # chosen on validation (Musical_Instruments): 30/90/180/365 within noise
index:
  kind: exact             # one-day run: exact search; full plan: faiss_hnsw
  metric: cosine
pool:
  stored_top_m: 200       # 50 and 100 are prefixes
  filters: [seen_before_query, not_yet_available]
gate:
  min_ann_overlap_at_100: 0.95   # only meaningful when index.kind == faiss_hnsw
channels: [dense, pop]    # chosen on validation, see PREREGISTRATION.md Amendment 3
