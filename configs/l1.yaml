encoder:
  model: Qwen/Qwen3-Embedding-0.6B
  revision: null          # TODO: pin to a commit hash before the first real run
user_vector:
  method: recency_weighted_mean_liked
  half_life_days: 180     # tuned on validation in the full plan; fixed for the one-day run
index:
  kind: exact             # one-day run: exact search; full plan: faiss_hnsw
  metric: cosine
pool:
  stored_top_m: 200       # 50 and 100 are prefixes
  filters: [seen_before_query, not_yet_available]
gate:
  min_ann_overlap_at_100: 0.95   # only meaningful when index.kind == faiss_hnsw
